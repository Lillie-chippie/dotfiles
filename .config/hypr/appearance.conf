################
### MONITORS ###
################

# Pantalla del portátil
monitor = eDP-1, preferred, 0x0, 1

# Monitor externo (comenta si no usas HDMI)
#monitor = HDMI-A-1, preferred, 1920x0, 1


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    col.active_border = rgba(f5bde6ee) rgba(c6a0f6ee) 45deg
    col.inactive_border = rgba(1e1e2eaa)

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 6

    active_opacity = 1.0
    inactive_opacity = 1.0
}

animations {
    enabled = yes

    bezier = smooth, 0.25, 1, 0.5, 1

    animation = windows, 1, 4, smooth
    animation = windowsIn, 1, 4, smooth
    animation = windowsOut, 1, 3, smooth
    animation = border, 1, 5, smooth
    animation = fade, 1, 3, smooth
    animation = workspaces, 1, 3, smooth
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
}

##############################
### WINDOWS RULES ###
##############################

windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1
