# vim:ft=kitty

## name:     Sweet Girly Dark (Mocha based)
## author:   Antigravity
## blurb:    Custom theme inspired by Madoka Magica picnic image.

# Transparency settings
background_opacity 0.8
dynamic_background_opacity yes

# The basic colors
foreground              #cad3f5
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5bde6

# Cursor colors
cursor                  #f5bde6
cursor_text_color       #1e1e2e

# Scrollbar colors
scrollbar_handle_color  #c6a0f6
scrollbar_track_color   #313244

# URL color when hovering with mouse
url_color               #f5bde6

# Kitty window border colors
active_border_color     #f5bde6
inactive_border_color   #45475a
bell_border_color       #eed49f

# Tab bar colors
active_tab_foreground   #11111b
active_tab_background   #f5bde6
inactive_tab_foreground #cad3f5
inactive_tab_background #181825
tab_bar_background      #11111b

# Terminal colors

# black
color0 #45475a
color8 #585b70

# red
color1 #f38ba8
color9 #f38ba8

# green
color2  #a6e3a1
color10 #a6e3a1

# yellow
color3  #eed49f
color11 #eed49f

# blue
color4  #8aadf4
color12 #8aadf4

# magenta
color5  #f5bde6
color13 #f5bde6

# cyan
color6  #91d7e3
color14 #91d7e3

# white
color7  #b8c0e0
color15 #a5adcb

# UI Settings
window_padding_width 10
confirm_os_window_close 0
